name: Release

# Publishing a GitHub release:
#  - cli-assets builds the Windows, Linux, and macOS CLI and desktop GUI and
#    attaches senbei-<version>-<target>.zip (CLI, GUI, README, LICENSE, the Asul
#    font license, and the legal notice extracted from README.md).
#  - deploy-web rebuilds the browser app and pushes it to Cloudflare Pages
#    (https://senbei.pages.dev). Requires two repository secrets:
#    CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID. The Pages
#    project is `senbei`; direct-upload projects default to `main` as the
#    production branch, which `--branch=main` targets.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cli-assets:
    permissions:
      contents: write # attach assets to the release
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: senbei.exe
            gui_bin: senbei-gui.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: senbei
            gui_bin: senbei-gui
          - os: macos-15
            target: aarch64-apple-darwin
            bin: senbei
            gui_bin: senbei-gui
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: senbei
            gui_bin: senbei-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p senbei-cli -p senbei-gui
      - name: Package senbei-<version>-<target>
        shell: bash
        run: |
          set -euo pipefail
          package=$(bash scripts/package-native.sh "${{ matrix.target }}" "${{ matrix.bin }}" "${{ matrix.gui_bin }}")
          if [[ "$RUNNER_OS" != macOS ]]; then
            (cd stage && 7z a "$package.zip" "$package" > /dev/null)
          fi
          echo "SENBEI_PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "stage/$SENBEI_PACKAGE.zip" --clobber

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install wasm-pack --locked
      # `-- --locked` forwards to cargo: senbei-wasm/Cargo.lock is committed on
      # purpose, so the wasm build must be pinned by it rather than silently
      # re-resolving (which is how it drifted out of sync with the manifest).
      # --out-dir emits the JS/wasm package into the static frontend's web/pkg/.
      - run: wasm-pack build --target web --release --out-dir ../web/pkg -- --locked
        working-directory: senbei-wasm
      - name: Stage static site
        run: node web/tools/stage.mjs dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=senbei --branch=main
