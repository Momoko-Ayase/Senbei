[workspace]
members = [
    "senbei-cli",
    "senbei-crypto",
    "senbei-io",
    "senbei-metadata",
    "senbei-pe",
]
default-members = ["senbei-cli"]
# The wasm bindings crate is its own crate (own Cargo.lock, cdylib) and stays
# outside the workspace.
exclude = ["senbei-wasm"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
indicatif = "0.18"
libc = "0.2"
owo-colors = "4"
tempfile = "3"
thiserror = "2"
walkdir = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }
senbei-crypto = { path = "senbei-crypto" }
senbei-io = { path = "senbei-io" }
senbei-metadata = { path = "senbei-metadata" }
senbei-pe = { path = "senbei-pe" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
