[workspace]
members = [
    "senbei-cli",
    "senbei-crypto",
    "senbei-elf",
    "senbei-engine",
    "senbei-gui",
    "senbei-i18n",
    "senbei-io",
    "senbei-metadata",
    "senbei-pe",
]
default-members = ["senbei-cli"]
# The wasm bindings crate is its own crate (own Cargo.lock, cdylib) and stays
# outside the workspace. `fuzz` is a cargo-fuzz crate with its own nightly
# requirements and must not join workspace builds.
exclude = ["senbei-wasm", "fuzz"]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
aes = "0.9"
anyhow = "1"
# The GUI renders with wgpu (Direct3D 12 or Vulkan); no OpenGL dependency.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
egui_system_font_provider = "0.37"
fontique = "0.11"
goblin = "0.10"
indicatif = "0.18"
libc = "0.2"
memmap2 = "0.9"
owo-colors = "4"
png = "0.18"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
walkdir = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }
zip = { version = "9.3", default-features = false, features = ["deflate"] }
senbei-crypto = { path = "senbei-crypto" }
senbei-elf = { path = "senbei-elf" }
senbei-engine = { path = "senbei-engine" }
senbei-i18n = { path = "senbei-i18n" }
senbei-io = { path = "senbei-io" }
senbei-metadata = { path = "senbei-metadata" }
senbei-pe = { path = "senbei-pe" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
