[workspace]
members = [
    "senbei-cli",
    "senbei-crypto",
    "senbei-elf",
    "senbei-engine",
    "senbei-io",
    "senbei-metadata",
    "senbei-pe",
]
default-members = ["senbei-cli"]
# The wasm bindings crate is its own crate (own Cargo.lock, cdylib) and stays
# outside the workspace.
exclude = ["senbei-wasm"]
resolver = "2"

[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
aes = "0.9"
anyhow = "1"
goblin = "0.10"
indicatif = "0.18"
libc = "0.2"
memmap2 = "0.9"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
walkdir = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
senbei-crypto = { path = "senbei-crypto" }
senbei-elf = { path = "senbei-elf" }
senbei-engine = { path = "senbei-engine" }
senbei-io = { path = "senbei-io" }
senbei-metadata = { path = "senbei-metadata" }
senbei-pe = { path = "senbei-pe" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
