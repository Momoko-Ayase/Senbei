<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Senbei: a static unpacker for CrackProof-protected Windows PE files, Android AArch64 libraries, and il2cpp metadata. Runs in this browser; files are never uploaded.">
<title>Senbei</title>
<link rel="icon" href="assets/icon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="i18n.js">
<link rel="modulepreload" href="state.js">
<link rel="modulepreload" href="view.js">
<link rel="modulepreload" href="detail.js">
<link rel="modulepreload" href="ui.js">
<link rel="modulepreload" href="model.js">
<link rel="modulepreload" href="engine.js">
<link rel="modulepreload" href="scan.js">
<link rel="modulepreload" href="run.js">
<link rel="modulepreload" href="report.js">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand"><img src="assets/icon-32.png" width="26" height="26" alt=""><span class="word">Senbei</span></div>
  </header>
  <div class="main blank" id="main">
    <aside class="inputs" id="inputs"></aside>
    <section class="detail" id="detail"></section>
  </div>
  <footer class="statusbar">
    <div class="status-line" id="status"></div>
    <button class="cancel" id="cancel" data-act="cancel" hidden></button>
  </footer>
</div>
<div id="menu"></div>
<div class="dragover" id="dragover" hidden><div class="box"><h2 id="dragover-title"></h2></div></div>
<dialog class="modal" id="legal"></dialog>
<dialog class="modal" id="settings"></dialog>
<input type="file" id="pick-files" multiple hidden>
<input type="file" id="pick-folder" webkitdirectory hidden>
<noscript><p style="padding:16px">Senbei runs in the browser and needs JavaScript.</p></noscript>
</body>
</html>
